name: Release PR

on:
  workflow_call:
    inputs:
      release-type:
        required: false
        type: string
        default: node
      target-branch:
        required: false
        type: string
        default: main
    secrets:
      RELEASE_PLEASE_TOKEN:
        required: false
      MELISIA_BOT_APP_ID:
        required: false
      MELISIA_BOT_APP_PRIVATE_KEY:
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      MELISIA_BOT_APP_ID: ${{ secrets.MELISIA_BOT_APP_ID }}
      MELISIA_BOT_APP_PRIVATE_KEY: ${{ secrets.MELISIA_BOT_APP_PRIVATE_KEY }}
    steps:
      - uses: actions/create-github-app-token@v2
        id: app-token
        if: env.MELISIA_BOT_APP_ID != '' && env.MELISIA_BOT_APP_PRIVATE_KEY != ''
        with:
          app-id: ${{ secrets.MELISIA_BOT_APP_ID }}
          private-key: ${{ secrets.MELISIA_BOT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Validate release credentials
        env:
          APP_ID: ${{ env.MELISIA_BOT_APP_ID }}
          APP_PRIVATE_KEY: ${{ env.MELISIA_BOT_APP_PRIVATE_KEY }}
          RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -n "$APP_ID" && -z "$APP_PRIVATE_KEY" || -z "$APP_ID" && -n "$APP_PRIVATE_KEY" ]]; then
            echo "Both MELISIA_BOT_APP_ID and MELISIA_BOT_APP_PRIVATE_KEY must be provided." >&2
            exit 1
          fi
          if [[ -z "$APP_ID" && -z "$RELEASE_PLEASE_TOKEN" ]]; then
            echo "Provide the Melisia Bot App credentials or RELEASE_PLEASE_TOKEN." >&2
            exit 1
          fi

      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ steps.app-token.outputs.token || secrets.RELEASE_PLEASE_TOKEN }}
          release-type: ${{ inputs.release-type }}
          target-branch: ${{ inputs.target-branch }}

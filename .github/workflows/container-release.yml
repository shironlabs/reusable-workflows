name: Container release

on:
  workflow_call:
    inputs:
      registry:
        required: true
        type: string
      image-prefix:
        required: true
        type: string
      images:
        description: Newline-separated name|dockerfile|context entries
        required: true
        type: string
      platforms:
        required: false
        type: string
        default: linux/arm64
    secrets:
      REGISTRY_USERNAME:
        required: true
      REGISTRY_PASSWORD:
        required: true

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: melisia-ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Install crane
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 \
            --connect-timeout 10 --max-time 300 \
            -o "$RUNNER_TEMP/crane.tar.gz" \
            https://github.com/google/go-containerregistry/releases/download/v0.21.9/go-containerregistry_Linux_x86_64.tar.gz
          tar -xzf "$RUNNER_TEMP/crane.tar.gz" -C "$RUNNER_TEMP" crane
      - name: Build and push release images
        env:
          REGISTRY: ${{ inputs.registry }}
          IMAGE_PREFIX: ${{ inputs.image-prefix }}
          IMAGES: ${{ inputs.images }}
          PLATFORMS: ${{ inputs.platforms }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          auth="$(printf '%s:%s' "$REGISTRY_USERNAME" "$REGISTRY_PASSWORD" | base64 | tr -d '\n')"
          mkdir -p "$HOME/.docker"
          printf '{"auths":{"%s":{"auth":"%s"}}}\n' "$REGISTRY" "$auth" > "$HOME/.docker/config.json"
          while IFS='|' read -r name dockerfile context; do
            [[ -z "$name" ]] && continue
            archive="$RUNNER_TEMP/${name}.tar"
            docker buildx build --platform "$PLATFORMS" --file "$dockerfile" \
              --output "type=docker,dest=$archive" --tag "$name:$tag" "$context"
            "$RUNNER_TEMP/crane" push --insecure "$archive" "$REGISTRY/$IMAGE_PREFIX/$name:$tag"
          done <<< "$IMAGES"

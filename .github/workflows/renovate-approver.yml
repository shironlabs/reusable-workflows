name: Renovate approver

on:
  workflow_call:
    secrets:
      APPROVER_APP_ID:
        required: true
      APPROVER_PRIVATE_KEY:
        required: true

permissions:
  pull-requests: write
  contents: read

jobs:
  approve:
    if: >-
      github.event.pull_request.user.login == 'renovate[bot]' ||
      github.event.pull_request.user.login == 'app/renovate'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create approver token
        id: app-token
        uses: actions/create-github-app-token@df432ceedc7162793a195dd1713ff69aefc7379e # v2.0.6
        with:
          app-id: ${{ secrets.APPROVER_APP_ID }}
          private-key: ${{ secrets.APPROVER_PRIVATE_KEY }}
      - name: Approve Renovate pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr review "$PR_NUMBER" --approve --repo "$GITHUB_REPOSITORY"
